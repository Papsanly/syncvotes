# Overlay on top of the config built into `dpm sandbox`, which stores every node in memory — so a
# restart drops the parties the wallet has keys for, and every party in `.wallet/*.sqlite` is
# orphaned. Pointing the nodes at H2 files keeps parties, contracts and the synchronizer id across
# restarts. H2 is embedded: these are plain files under `.canton/`, there is no server to run.

# The reference sequencer's block store is the exception — it only accepts `memory` or `postgres`,
# not `h2`. Leaving it in memory costs nothing here: the sequencer's identity and topology live in
# its own (persisted) store, so the synchronizer id is stable and the participant reconnects to the
# same synchronizer on every start.

canton {
    participants.sandbox.storage {
        type = h2
        config {
            driver = org.h2.Driver
            url = "jdbc:h2:file:./.canton/participant;MODE=PostgreSQL;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1"
            user = "sa"
            password = ""
        }
    }
    sequencers.sequencer1 {
        storage {
            type = h2
            config {
                driver = org.h2.Driver
                url = "jdbc:h2:file:./.canton/sequencer;MODE=PostgreSQL;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1"
                user = "sa"
                password = ""
            }
        }
        sequencer.config.storage { type = memory }
    }
    mediators.mediator1.storage {
        type = h2
        config {
            driver = org.h2.Driver
            url = "jdbc:h2:file:./.canton/mediator;MODE=PostgreSQL;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1"
            user = "sa"
            password = ""
        }
    }
}
